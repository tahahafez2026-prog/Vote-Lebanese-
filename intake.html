<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل بيانات الناخب</title>
<style>
:root{--bg:#f3f7f6;--c:#fff;--t:#1f2a2a;--m:#6a7d7c;--b:#d6e2e0;--p:#0b5b5b;--pt:#fff;--d:#8f1c20;--pl:#e4f0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#101a1a;--c:#182424;--t:#e6efee;--m:#95aaa8;--b:#2b3d3c;--p:#3aa59f;--pt:#062524;--d:#e2706f;--pl:#1e3331}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.w{max-width:720px;margin:auto;padding:12px}h1{font-size:18px;text-align:center;color:var(--p);margin:6px 0}h3{margin:14px 0 6px;font-size:15px;color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:10px}
input,select,textarea,button{font:inherit;font-size:16px;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px;width:100%}
button{width:auto;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}.pr{background:var(--p);color:var(--pt);border-color:var(--p)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:520px){.g,.g3{grid-template-columns:1fr}}
label{font-size:12px;color:var(--m);display:block;margin-top:6px}label.rq::after{content:" *";color:var(--d)}
.msg{padding:8px;border-radius:10px;background:var(--pl);border:1px solid var(--b);font-size:13px;color:var(--m);margin-top:8px}.msg.bad{background:transparent;border-color:var(--d);color:var(--d);font-weight:600}.msg.ok{border-color:var(--p);color:var(--p);font-weight:600}.hide{display:none}
.brand{text-align:center;margin:6px 0 10px}.brand img{width:84px;height:84px;object-fit:contain;border-radius:22px;background:#fff;border:2px solid var(--p);padding:6px;margin:0 6px}.brand small{display:block;color:var(--m);font-size:12px;margin-top:5px}
.dr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;padding:8px;border:1px solid var(--b);border-radius:10px}.dr b{flex:1;min-width:120px;font-size:14px}.dc{background:var(--pl);border-radius:99px;padding:1px 9px;font-size:12px}
.btn{display:inline-block;padding:8px 12px;border:1px solid var(--b);border-radius:10px;cursor:pointer;font-size:13px;position:relative;overflow:hidden}.btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;padding:0;border:0}
.im{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.im div{position:relative}.im img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--b)}.im i{position:absolute;top:-4px;left:-4px;background:var(--d);color:#fff;border-radius:50%;width:26px;height:26px;line-height:26px;text-align:center;font-style:normal;cursor:pointer}
.pdf{display:inline-block;padding:20px 8px;border:1px solid var(--b);border-radius:8px;font-size:12px}
</style></head><body><div class="w" id="app"><div class="msg">جارٍ التحميل…</div></div>

async function boot(){
 try{const c=await Promise.race([call({op:"get",c:"meta",id:"config"}),new Promise((_,no)=>setTimeout(()=>no(new Error("t")),12000))]);if(c&&c.exists&&c.data&&c.data.active)year=c.data.active}catch(e){}
 $("#app").innerHTML=`<div class="brand"><img src="${FLAG}" alt=""><img src="${LOGO}" alt=""><small>هذا التطبيق مقدم من مجموعة حجر وبشر - اللجنة السياسية</small></div><h1>تسجيل بيانات الناخب — انتخابات ${year}</h1><div class="card" id="box"><p class="msg" style="margin-top:0">املأ جميع الحقول المعلَّمة بـ * وأرفق مستنداً واحداً على الأقل (صورة الهوية أو إخراج القيد أو أي مستند). يُسمح بالتسجيل مرة واحدة لكل شخص، وبعمر 18 سنة وما فوق.</p><form id="f" novalidate><div class="g">${fld("fn","الاسم")}${fld("fa","اسم الأب")}${fld("mo","اسم الأم وشهرتها")}${fld("ln","الشهرة / العائلة")}${fld("dob","تاريخ الولادة","date")}<div><label class="rq">الجنس</label><select name="sx">${opts(["","ذكر","أنثى"])}</select></div>${fld("sect","المذهب")}${fld("nid","رقم الهوية / الوثيقة")}${fld("reg","رقم السجل")}${fld("ph","الهاتف","tel")}</div><div class="msg bad hide" id="ag"></div>${loc("r","مكان القيد",1)}${loc("l","مكان السكن الحالي (اختياري)",0)}<div><label>الحالة</label><select name="vs">${opts(["مقيم","مغترب","متوفى","منتقل"])}</select></div><label>ملاحظات (اختياري)</label><textarea name="nt" rows="2"></textarea><h3>المستندات * — مستند واحد على الأقل</h3>${[["صورة هوية","🪪 صورة الهوية"],["إخراج قيد","📄 إخراج القيد"],["أخرى","📎 مستند آخر"]].map(([t,l])=>`<div class="dr"><b>${l}</b><span class="dc" data-dc="${t}">0</span><label class="btn">🖼 من الجهاز<input type="file" class="dp" data-dt="${t}" accept="image/*,application/pdf" multiple></label><label class="btn">📷 كاميرا<input type="file" class="dp" data-dt="${t}" accept="image/*" capture="environment"></label></div>`).join("")}<div class="msg hide" id="um"></div><div class="im" id="im"></div><div class="msg bad hide" id="em"></div><div style="margin-top:12px"><button class="pr" id="sv">إرسال</button></div></form></div>`;
 wire()}
function wire(){
 const f=$("#f");let blocked=false;
 const chk=()=>{const m=$("#ag");blocked=false;m.classList.add("hide");const dv=f.dob.value;if(dv){const a=age(dv);if(a==null||a<0||a>120){blocked=true;m.textContent="تاريخ الولادة غير صحيح."}else if(a<18){blocked=true;m.textContent="⛔ لم نستطع إكمال التسجيل: لا يحق لك المشاركة في الانتخابات بسبب عمرك ("+a+" سنة)، يجب أن يكون العمر 18 سنة على الأقل."}if(blocked)m.classList.remove("hide")}$("#sv").disabled=blocked};
 f.addEventListener("change",e=>{if(e.target.dataset.p){const p=e.target.dataset.p;f[p+"q"].innerHTML=opts(["",...(GOV[e.target.value]||[])])}if(e.target.name=="dob")chk()});
 f.addEventListener("input",e=>{if(e.target.name=="dob")chk()});
 const um=(t,c)=>{const u=$("#um");u.textContent=t;u.className="msg "+(c||"")};
 const draw=()=>{document.querySelectorAll("[data-dc]").forEach(s=>{s.textContent=imgs.filter(m=>m.type==s.dataset.dc).length});$("#im").innerHTML=imgs.map((m,i)=>`<div>${/pdf/.test(m.mime)?`<span class="pdf">📄 PDF</span>`:`<img src="${E(m.url)}" alt="">`}<i data-i="${i}">×</i></div>`).join("")};
 $("#im").onclick=e=>{if(e.target.dataset.i){imgs.splice(+e.target.dataset.i,1);draw()}};
 f.querySelectorAll("input.dp").forEach(inp=>{inp.onchange=async e=>{const t=inp.dataset.dt,fl=[...e.target.files];e.target.value="";for(const file of fl){try{um("جارٍ رفع "+file.name+"…");imgs.push(await upload(file,t));draw();um("✓ تم رفع "+file.name,"ok")}catch(x){um("فشل رفع "+file.name+": "+(x.message||x),"bad")}}}});
 const err=t=>{const m=$("#em");m.textContent=t;m.classList.remove("hide")};
 f.onsubmit=async e=>{e.preventDefault();chk();if(blocked)return;const d=Object.fromEntries(new FormData(f)),miss=REQ.filter(([k])=>!String(d[k]||"").trim()).map(x=>x[1]);
  if(miss.length)return err("يرجى تعبئة الحقول الإلزامية: "+miss.join("، "));
  if(!imgs.length)return err("إرفاق مستند واحد على الأقل إلزامي (صورة الهوية أو إخراج القيد أو مستند آخر).");
  const b=$("#sv");b.disabled=true;$("#em").classList.add("hide");
  try{const ks=regKeys(d,year);for(const k of ks){const s=await call({op:"get",c:"registry",id:k});if(s&&s.exists){err("⛔ هذا الشخص مسجّل مسبقاً، ولا يمكن إدخال المعلومات مرة أخرى.");b.disabled=false;return}}
   for(const k of ks)await call({op:"set",c:"registry",id:k,data:{at:Date.now()}});
   let uid="";try{uid=localStorage.getItem("uid")||("u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));localStorage.setItem("uid",uid)}catch(x){}
   await call({op:"set",c:"submissions",id:"s"+Date.now()+Math.random().toString(36).slice(2,6),data:Object.assign({},d,{imgs:imgs,yr:year,at:Date.now(),by:uid,status:"new"})});
   $("#box").innerHTML='<h3>✅ تم الإرسال بنجاح، شكراً لك.</h3><div class="msg ok">سيراجع المسؤول طلبك.</div>'}
  catch(x){err("تعذر الإرسال: "+(x.message||x));b.disabled=false}};
 chk()}
window.addEventListener("error",e=>{const a=$("#app");if(a&&a.children.length==1&&a.firstElementChild.className=="msg")a.innerHTML='<div class="card"><div class="msg bad" id="se"></div><button class="pr" style="margin-top:8px" onclick="location.reload()">إعادة المحاولة</button></div>',$("#se").textContent="تعذر تشغيل الصفحة: "+(e.message||"")});
boot();
})();
</script></body></html>
